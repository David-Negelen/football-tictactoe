<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiki-Taka-Toe</title>
  <meta name="description" content="Football-themed tic-tac-toe: name a real player who fits both the row and column category.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiki-Taka-Toe">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="/static/js/pwa.js" defer></script>
  <style>
    body { background: #14532d; font-family: 'Inter', system-ui, sans-serif; }
    .cell-btn { transition: transform .12s, filter .12s; }
    .cell-btn:not(:disabled):hover { transform: scale(1.04); filter: brightness(1.15); }
    .cell-btn:disabled { cursor: default; }
    @keyframes pop {
      0%   { transform: scale(.45); opacity: 0; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1);   opacity: 1; }
    }
    .pop { animation: pop .28s ease forwards; }
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 0 0 #fbbf24bb; }
      50%       { box-shadow: 0 0 0 10px #fbbf2400; }
    }
    .win-cell { animation: pulse-gold 1.3s ease-in-out infinite; }
    .diff-btn { transition: background .15s, color .15s; }
    .mode-card { transition: background .15s, border-color .15s, transform .15s; }
    .mode-card:hover { transform: translateY(-2px); }
    @keyframes confetti-fall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <header class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-md flex-shrink-0">
    <h1 class="text-base font-bold tracking-tight flex items-center gap-2">
      <span class="text-lg">🎮</span>
      <span>Tiki-Taka-Toe</span>
    </h1>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <div id="diff-picker" class="flex rounded-lg overflow-hidden border border-slate-600">
        <button data-diff="1" class="diff-btn px-2.5 py-1 text-xs font-semibold bg-slate-700 text-slate-300 hover:text-white transition-colors">Leicht</button>
        <button data-diff="2" class="diff-btn px-2.5 py-1 text-xs font-semibold bg-slate-700 text-slate-300 hover:text-white border-x border-slate-600 transition-colors">Mittel</button>
        <button data-diff="3" class="diff-btn px-2.5 py-1 text-xs font-semibold bg-yellow-400 text-slate-900 transition-colors">Schwer</button>
      </div>
      <button id="btn-menu" class="hidden items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">🏠 Menü</button>
      <button id="btn-stats" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">📊 Stats</button>
      <button id="btn-install" class="hidden items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">⬇️ Installieren</button>
    </div>
  </header>

  <div class="flex flex-col items-center py-5 px-4 flex-1 w-full">

  <!-- Modus-Auswahl -->
  <div id="screen-mode-select" class="w-full max-w-3xl flex flex-col items-center gap-6 py-8">
    <h2 class="text-white text-xl font-bold">Spielmodus wählen</h2>
    <div class="grid sm:grid-cols-3 gap-4 w-full">
      <button data-mode="solo" class="mode-card flex flex-col items-center justify-center gap-2 rounded-2xl bg-green-800/60 hover:bg-green-700/70 border border-green-600/40 hover:border-yellow-400/60 p-6 text-center">
        <span class="text-4xl">🧩</span>
        <span class="font-bold text-white">Solo</span>
        <span class="text-xs text-green-200/70">Fülle das Raster allein aus</span>
      </button>
      <button data-mode="local" class="mode-card flex flex-col items-center justify-center gap-2 rounded-2xl bg-green-800/60 hover:bg-green-700/70 border border-green-600/40 hover:border-yellow-400/60 p-6 text-center">
        <span class="text-4xl">🛋️</span>
        <span class="font-bold text-white">1v1 Lokal</span>
        <span class="text-xs text-green-200/70">Ein Gerät, zwei Spieler im Wechsel</span>
      </button>
      <button data-mode="online" class="mode-card flex flex-col items-center justify-center gap-2 rounded-2xl bg-green-800/60 hover:bg-green-700/70 border border-green-600/40 hover:border-yellow-400/60 p-6 text-center">
        <span class="text-4xl">🌐</span>
        <span class="font-bold text-white">1v1 Online</span>
        <span class="text-xs text-green-200/70">Gegen einen Freund, live über einen Raum-Code</span>
      </button>
    </div>
  </div>

  <!-- Online-Lobby -->
  <div id="screen-online-lobby" class="hidden w-full max-w-md flex flex-col items-center gap-4 py-8">
    <div id="online-lobby-body" class="w-full"></div>
  </div>

  <!-- Spielfeld-Screen (Solo / Lokal / Online) -->
  <div id="screen-board" class="hidden w-full flex flex-col items-center">

    <!-- Statusleiste -->
    <div id="status-bar"
      class="w-full max-w-3xl mb-3 rounded-xl px-4 py-2 flex items-center justify-between gap-3 font-bold text-white text-sm bg-green-800 border border-green-600 min-h-[38px]">
      <span id="status-text">Rätsel wird geladen…</span>
      <span class="flex items-center gap-3 text-xs font-semibold text-green-200 flex-shrink-0">
        <span id="streak-display" class="hidden items-center gap-1"></span>
        <span id="timer-display">⏱ 0:00</span>
      </span>
    </div>

    <!-- Spielfeld: 4×4 CSS-Grid -->
    <div id="board"
      class="grid gap-2 w-full max-w-3xl"
      style="grid-template-columns: repeat(4, 1fr);">
    </div>

    <!-- Buttons -->
    <div class="mt-4 flex gap-3">
      <button id="btn-give-up"
        class="bg-orange-500 hover:bg-orange-400 text-white font-bold text-xs px-5 py-2 rounded-full tracking-widest uppercase transition-colors opacity-80 hover:opacity-100 disabled:opacity-30">
        Aufgeben
      </button>
    </div>

  </div>

  </div><!-- /content -->

  <!-- Spieler-Suche Modal -->
  <div id="modal"
    class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"
    style="backdrop-filter:blur(3px)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
      <div class="bg-green-800 px-5 py-3 flex items-center justify-between">
        <span id="modal-title" class="text-white font-bold text-sm leading-snug"></span>
        <button id="modal-close" class="text-green-300 hover:text-white text-2xl leading-none ml-3 flex-shrink-0">×</button>
      </div>
      <div class="p-4">
        <input id="search-input" type="text" placeholder="Spieler suchen…" autocomplete="off"
          class="w-full border-2 border-green-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-600 mb-3">
        <div id="search-results" class="space-y-1 max-h-64 overflow-y-auto"></div>
        <p id="search-hint" class="text-xs text-slate-400 mt-2 text-center">
          Mindestens 3 Buchstaben eingeben
        </p>
        <p id="search-error" class="text-xs text-red-500 mt-1 text-center hidden"></p>
      </div>
    </div>
  </div>

  <!-- Endspiel-Overlay -->
  <div id="end-modal"
    class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4"
    style="backdrop-filter:blur(4px)">
    <div class="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-xs w-full">
      <div id="end-icon" class="text-6xl mb-3"></div>
      <h2 id="end-title" class="text-2xl font-black mb-1"></h2>
      <p id="end-sub" class="text-slate-500 text-sm mb-1"></p>
      <p id="end-extra" class="text-slate-400 text-xs mb-6"></p>
      <div class="flex flex-col gap-2">
        <button id="end-new-game"
          class="bg-green-700 hover:bg-green-600 text-white font-bold px-6 py-2.5 rounded-full transition-colors">
          Nochmal spielen
        </button>
        <button id="end-menu"
          class="text-slate-400 hover:text-slate-600 text-xs font-semibold transition-colors">
          Zurück zum Menü
        </button>
      </div>
    </div>
  </div>

  <!-- Statistik-Modal -->
  <div id="stats-modal"
    class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4"
    style="backdrop-filter:blur(4px)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden max-h-[85vh] flex flex-col">
      <div class="bg-slate-700 px-5 py-3 flex items-center justify-between flex-shrink-0">
        <span class="text-white font-bold text-sm">📊 Deine Statistik</span>
        <button id="stats-close" class="text-slate-300 hover:text-white text-2xl leading-none">×</button>
      </div>
      <div id="stats-body" class="p-5 space-y-4 overflow-y-auto"></div>
    </div>
  </div>

  <!-- Konfetti-Layer -->
  <div id="confetti-layer" class="fixed inset-0 pointer-events-none z-[70] overflow-hidden" aria-hidden="true"></div>

  <script src="/static/js/game.js" defer></script>
</body>
</html>
